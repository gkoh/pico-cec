## IDF Component Manager Manifest File
#
# https://espressif-docs.readthedocs-hosted.com/projects/idf-component-manager/en/v1.4.0/reference/manifest_file.html
#
dependencies:
  espressif/led_strip:
    version: "^3.0.0"
    rules:
      - if: target in ["esp32c2", "esp32c3", "esp32s3"]
  espressif/esp_tinyusb:
    version: "^1.1"
    rules:
      - if: target in ["esp32c2", "esp32s3"]
